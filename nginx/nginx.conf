# Global context - affects entire NGINX instance
events {
    worker_connections 1024; # Max connections per worker process
}

http {
    # HTTP context - applies to all HTTP traffic

    # 1. UPSTREAM DEFINITION
    upstream taskmanager {
        server taskmanager-app:8080; # Docker service name
        # Could add more servers here for load balancing:
        # server taskmanager-app-2:8080;
        # server taskmanager-app-3:8080;
    }

    # 2. RATE LIMITTING SETUP
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # $binary_remote_addr: Binary representation of client IP (saves memory)
    # zone=api:10m: Create 10MB memory zone named "api"
    # rate=10r/s: Allow 10 requests per second per IP

    # 3. LOGGING CONFIGURATION
    access_log /var/log/nginx/access.log; # Log all requests
    error_log /var/log/nginx/error.log; # Log errors

    # 4. COMPRESSION SETTINGS
    gzip on; # Enable compression
    gzip_vary on; # Add "Vary: Accept-Encoding" header
    gzip_min_length 1024; # Only compress files > 1KB
    gzip_proxied any; # Compress responses for all proxied requests
    gzip_comp_level 6; # Compression level (1-9, 6 is good balance)
    gzip_types # File types to compress
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 5. SERVER BLOCK
    server {
        listen 80; # Listen on port 80 (HTTP)
        server_name localhost; # Respond to requests for "localhost"

        # 6. SECURITY HEADERS
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # 7. API ROUTE WITH RATE LIMITING
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            # zone=api: Use the rate limiting zone defined above
            # burst=20: Allow up to 20 requests in a burst
            # nodelay: Don't delay requests within burst limit

            proxy_pass http://taskmanager; # Forward to upstream

            # Forward client information to backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # 8. HEALTH CHECK ROUTE
        location /health {
            proxy_pass http://taskmanager;
            access_log off; # Don't log health check requests
        }

        # 9. CATCH-ALL ROUTE
        location / {
            proxy_pass http://taskmanager;
            proxy_set_header HOST $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}